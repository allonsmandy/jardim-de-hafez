introduction: # «NOVO» 2 a 3 parágrafos para quem nunca leu poesia persa
  - Um rubai é uma quadra — quatro versos — que diz tudo de uma vez, como um bilhete. Neste, o
    poeta confessa que, desde que se apaixonou, não enxerga mais nada nem consegue dormir.
  - 'Curiosidade: os rubaiyat atribuídos a Hafez são poucos, e os estudiosos têm menos certeza
    sobre a autoria deles do que sobre os gazéis.'

stanzaNotes: # «NOVO» UM item para CADA estrofe (stanza começa em 1)
  - stanza: 1
    plain: Desde que te conheci, só penso em você e só quero ir aonde você está.
    meaning: >-
      "Imagem" (naqsh) é também pintura, desenho: o rosto do amado ficou pintado nos olhos do
      poeta. A "rua do amado" é imagem clássica da poesia persa: o amante ronda a rua de quem ama
      na esperança de vê-lo. Na leitura mística, é a alma que só vê Deus em tudo.
    literal: Exceto a imagem de ti, em vista não veio a nós / exceto a rua de ti, passante não veio a nós.
    choices: >-
      "Rahgozar" é ao mesmo tempo "caminho" e "quem passa"; escolhemos "caminho… aos pés" para
      manter o paralelismo com "aos olhos" do primeiro verso.
  - stanza: 2
    plain: Todo mundo dorme tranquilo, menos eu — de tanto pensar em você.
    meaning: >-
      A insônia do amante é tema antigo: enquanto o mundo dorme, quem ama vigia. "No teu tempo"
      pode ser também "sob o teu reinado", tratando o amado como um rei.
    literal: O sono, embora agradável tenha vindo a todos no teu tempo, / na verdade, ao olho não entrou para nós.
    choices: >-
      "Ahd" é "época" e também "pacto, reinado"; ficamos com "no teu tempo" e explicamos o duplo
      sentido aqui.

