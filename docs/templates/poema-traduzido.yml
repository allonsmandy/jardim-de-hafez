culturalNotes: # «NOVO» opcional, 1 a 3 notas sobre o poema inteiro
  - title: A rua do amado
    body: Na poesia persa, o amante passa os dias na rua de quem ama, como um mendigo à porta.
      Hafez volta a essa imagem dezenas de vezes no Divã.

