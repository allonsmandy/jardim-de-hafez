translation:
  language: pt-BR
  kind: translation
  stanzas:
    - - Copeiro, que a chegada da festa te traga alegria;
      - e não te esqueças do que nos prometeste.
    - - Espanta-me que, durante tantos dias longe de nós,
      - tenhas evitado os amigos, mesmo querendo voltar.
    - - 'Leva nossa saudação à filha da videira e diz que ela pode sair:'
      - nossas preces e nossa vontade a libertaram das amarras.
    - - A alegria de todos começa com teus passos e tua chegada;
      - que a tristeza caiba ao coração que não te quiser alegre.
    - - Graças a Deus, os ataques do outono não feriram
      - teu jardim de jasmins, ciprestes, rosas e buxos.
    - - Longe o mau-olhado! Daquela separação te trouxeram de volta
      - tua estrela ilustre e a fortuna que nasceu contigo.
    - - Hafez, não abandones a segurança desta arca de Noé,
      - ou a tempestade da vida levará tudo o que te sustenta.
