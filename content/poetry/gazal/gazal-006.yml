  stanzas:
    - - 'Quem levará esta prece aos que servem o sultão:'
      - “Em gratidão por seres rei, não expulses o mendigo do teu olhar”?
    - - Do rival de alma demoníaca busco refúgio no meu Deus;
      - talvez aquela estrela cadente venha me socorrer — por Deus!
    - - Se teus cílios negros fizeram sinal para o nosso sangue,
      - cuidado com a astúcia deles, e não cometas esse erro, ó bela.
    - - Incendeias o coração de um mundo inteiro quando acendes o rosto;
      - que ganhas com isso, se não mostras nenhuma brandura?
    - - 'A noite inteira vivo nesta esperança: que a brisa da manhã'
      - com a mensagem dos amigos venha acariciar o amigo.
    - - Que juízo final é este, ó alma, que mostraste aos amantes?
      - Coração e vida em oferenda ao teu rosto — mostra-nos a face!
    - - Por Deus, dá um gole a Hafez, que se levanta de madrugada,
      - pois a prece do amanhecer há de trazer-te algum bem.
