translation:
  language: pt-BR
  kind: translation
  stanzas:
    - - Copeiro, acende a nossa taça com a luz do vinho;
      - 'cantor, canta: o mundo agora anda como queremos.'
    - - Nós vimos na taça o reflexo do rosto do amado —
      - ó tu, que nada sabes do prazer do nosso beber sem fim!
    - - 'Jamais morre aquele cujo coração foi vivificado pelo amor:'
      - está inscrita no registro do mundo a nossa permanência.
    - - Só dura o charme e o dengo dos de porte esbelto
      - até que surja, em todo o seu brilho, o nosso cipreste de andar elegante.
    - - Ó vento, se passares pelo roseiral dos amigos,
      - por favor, leva ao amado a nossa mensagem.
    - - 'Dize: por que apagas de propósito o nosso nome da memória?'
      - Virá por si o dia em que não lembrarás o nosso nome.
    - - A embriaguez fica bem nos olhos da beldade que nos prende o coração;
      - por isso confiaram à embriaguez as nossas rédeas.
    - - Temo que, no Dia do Juízo, não leve nenhuma vantagem
      - o pão honesto do xeque sobre a nossa água proibida.
    - - 'Hafez, derrama dos olhos grãos de lágrimas:'
      - quem sabe o pássaro da união venha cair na nossa armadilha.
    - - O mar verde do céu e o barco da lua nova
      - estão mergulhados na generosidade do nosso Haji Qavam.
