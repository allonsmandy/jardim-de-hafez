translation:
  language: pt-BR
  kind: translation
  stanzas:
    - - O jejum ficou para trás, a festa chegou e os corações se ergueram;
      - 'o vinho ferveu na adega: é hora de pedi-lo.'
    - - Passou a vez dos que exibem devoção e tornam tudo pesado;
      - chegou o tempo da liberdade e da alegria dos rends.
    - - Que censura merece quem bebe um vinho assim?
      - por que chamar isso de tamanho defeito e tamanho erro?
    - - Beber vinho sem fingimento nem exibição
      - é melhor que vender devoção cheia de aparência e hipocrisia.
    - - Não fingimos ser livres nem fazemos amizade com a falsidade;
      - quem conhece o que está escondido sabe que somos sinceros.
    - - Cumprimos o dever dado por Deus e não fazemos mal a ninguém;
      - e não dizemos que é permitido aquilo que dizem não ser.
    - - Que mal há se eu e tu bebermos algumas taças?
      - O vinho é sangue das videiras, não é sangue de vocês.
    - - Que defeito é esse, para causar tamanho mal?
      - E, mesmo que seja um defeito, quem neste mundo não tem nenhum?
