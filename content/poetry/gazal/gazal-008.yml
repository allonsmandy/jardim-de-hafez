translation:
  language: pt-BR
  kind: translation
  stanzas:
    - - Copeiro, levanta-te e passa a taça;
      - joga terra na cabeça da tristeza dos dias.
    - - Põe na minha mão a taça de vinho, para que eu arranque do corpo
      - este manto cor de anil.
    - - Ainda que seja má fama aos olhos dos sensatos,
      - nós não queremos nem honra nem renome.
    - - Passa o vinho! Até quando este vento de orgulho?
      - Terra na cabeça desse ego sem bom fim!
    - - A fumaça dos suspiros do meu peito que geme
      - queimou esses gelados e crus.
    - - Confidente do segredo do meu coração enlouquecido
      - não vejo ninguém, nem entre os nobres nem entre o povo.
    - - Meu coração está feliz com quem lhe dá sossego —
      - e que, de uma vez, roubou o sossego do meu coração.
    - - Não olha mais para o cipreste no jardim
      - quem viu aquele cipreste de corpo de prata.
    - - 'Tem paciência, Hafez, na dureza, de dia e de noite:'
      - no fim, um dia, alcançarás o teu desejo.
