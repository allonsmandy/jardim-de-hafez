  stanzas:
    - - Se aquele turco de Shiraz tomar nas mãos o meu coração,
      - por sua pinta escura eu darei Samarcanda e Bucara.
    - - Dá, copeiro, o vinho que resta, pois no paraíso não acharás
      - a margem das águas de Roknabad nem os passeios floridos de Mosalla.
    - - Ai! Esses ciganos travessos, encantadores, que alvoroçam a cidade,
      - roubaram a paciência do coração como os turcos pilham a mesa do banquete.
    - - 'Do nosso amor imperfeito a beleza do amado não precisa:'
      - de que precisa um rosto belo de pintura, cor, pinta e penugem?
    - - Por aquela beleza sempre crescente de José, eu soube
      - que o amor arranca Zuleica de trás do véu do pudor.
    - - 'Se me insultares, ou se me amaldiçoares, eu te abençoarei:'
      - resposta amarga fica bem a um lábio de rubi que derrama açúcar.
    - - Ouve um conselho, minha alma, pois mais que à própria vida amam
      - os jovens afortunados o conselho do velho sábio.
    - - Fala do músico e do vinho, e busca menos o segredo do tempo,
      - pois ninguém resolveu, nem resolverá pela razão, este enigma.
    - - 'Fizeste um gazel e furaste pérolas: vem e canta-o com doçura, Hafez,'
      - pois sobre os teus versos o céu esparge o colar das Plêiades.
