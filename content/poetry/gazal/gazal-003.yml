culturalNotes:
  - title: A lenda de Hafez e Tamerlão
    body:
      Dowlatshah Samarqandi, no seu "Memorial dos Poetas" (1487), conta que Tamerlão, ao conquistar
      Shiraz, repreendeu Hafez por "dar" Samarcanda e Bucara, e o poeta, pobre, teria respondido que
      foi por causa dessa generosidade que chegara à miséria. A anedota surgiu cerca de um século
      depois dos fatos e é considerada lendária pelos estudiosos modernos.
    sources:
      - source: dowlatshah-tazkira
      - source: encyclopaedia-iranica
  - title: Um poema famoso no Ocidente
    body:
      Este gazel foi um dos primeiros de Hafez traduzidos para o inglês, por William Jones (1771), e
      contribuiu para a fama do poeta na Europa, que depois inspiraria Goethe.
