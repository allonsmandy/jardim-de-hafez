    - - Ó brisa da manhã, onde fica o repouso do amado?
      - Onde mora aquela pessoa bela como a lua, que faz os amantes sofrerem?
    - - 'A noite está escura, e adiante fica o caminho do vale de Ayman:'
      - onde está o fogo do Sinai, onde o encontro marcado?
    - - Todo aquele que vem ao mundo acaba conhecendo a ruína;
      - 'perguntai na taverna: existe alguém realmente sóbrio?'
    - - Só recebe a boa notícia quem sabe reconhecer os sinais;
      - há tantos segredos — onde está alguém capaz de entendê-los?
    - - Cada fio de meu cabelo tem mil coisas para tratar contigo;
      - que distância existe entre nós e esse crítico que nada tem para fazer!
    - - 'Perguntai de novo a seus cabelos, dobra sobre dobra:'
      - onde está este coração aflito, perdido e prisioneiro?
    - - 'Minha razão enlouqueceu: onde estão aqueles cachos perfumados?'
      - 'Meu coração me abandonou: onde está a sobrancelha do amado?'
    - - Copeiro, músico e vinho estão todos prontos, mas
      - 'sem o amado a alegria não se prepara: onde está o amado?'
    - - Hafez, não te aflijas com o vento do outono no jardim do mundo;
      - 'pensa com sensatez: onde existe rosa sem espinho?'
