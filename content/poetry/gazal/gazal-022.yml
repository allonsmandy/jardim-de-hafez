translation:
  language: pt-BR
  kind: translation
  stanzas:
    - - Quando ouvires as palavras de quem conhece o coração, não digas que estão erradas;
      - tu não sabes reconhecer tais palavras, meu bem — o erro está aí.
    - - Minha cabeça não se curva nem a este mundo nem ao outro;
      - bendito Deus, quantos tumultos carrego dentro dela!
    - - 'Não sei quem vive dentro de mim, cansado de sofrer:'
      - eu estou calado, mas ele grita e faz alvoroço.
    - - Meu coração saiu de trás da cortina; onde estás, músico?
      - toca e lamenta, pois é dessa música que nossa vida ganha voz.
    - - Nunca dei importância aos negócios do mundo;
      - foi teu rosto que os tornou tão belos aos meus olhos.
    - - Não dormi por causa de um desejo que meu coração prepara;
      - tenho a ressaca de cem noites — onde está a casa do vinho?
    - - Meu sangue manchou tanto este convento
      - que, se me lavardes com vinho, tereis razão.
    - - Sou estimado no templo dos magos
      - porque há em meu coração um fogo que nunca morre.
    - - Que música tocava escondido aquele músico?
      - A vida passou, mas minha cabeça ainda está cheia de desejo.
    - - Ontem à noite, anunciaram teu amor dentro de mim;
      - o peito de Hafez ainda está cheio do eco.
