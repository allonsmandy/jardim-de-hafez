themes: [Abandonar tudo por amor, Não perder a esperança, O poder que vira vento]
introduction:
  - >-
    Hafez avisa que não se comportará como esperam: o amor já o afastou da vida respeitável e de tudo
    o que antes parecia importante. O vinho pode ser bebida, paixão ou êxtase espiritual.
  - O poema termina com uma brincadeira amarga sobre Salomão, rei que comandava o vento. Hafez diz
    que também se tornou Salomão, mas porque ficou apenas com vento nas mãos — ou seja, sem nada.
stanzaNotes:
  - {
      stanza: 1,
      plain: 'Não espere que eu me comporte como um homem correto; desde sempre meu caminho foi outro.',
      meaning: "O 'dia da criação' é o momento anterior ao nascimento em que o destino teria sido decidido.",
    }
  - {
      stanza: 2,
      plain: 'Quando entrei no amor, despedi-me de tudo o que existia antes.',
      meaning: 'Lavar-se lembra a preparação para a oração. As quatro despedidas lembram a oração feita sobre os mortos: para Hafez, o velho mundo morreu.',
    }
  - {
      stanza: 3,
      plain: 'Dá-me vinho e eu direi quem me fez apaixonar e perder o controle.',
      meaning: 'Hafez promete revelar o destino, mas sua resposta volta ao rosto e ao perfume do amado.',
    }
  - {
      stanza: 4,
      plain: 'Mesmo diante de algo enorme, não desista de receber perdão e ajuda.',
      meaning: 'Montanha e formiga mostram que tamanhos e forças comuns não valem diante da misericórdia de Deus.',
    }
  - {
      stanza: 5,
      plain: 'Neste mundo, ninguém foi realmente feliz — talvez apenas teus belos olhos.',
      meaning: 'O teto azul é o céu. Os olhos do amado são chamados de bêbados porque parecem lânguidos e sedutores.',
    }
  - {
      stanza: 6,
      plain: 'Tua boca é o botão mais bonito que Deus colocou no jardim do mundo.',
      meaning: 'A boca pequena e fechada lembra um botão de rosa. Hafez oferece a própria vida em troca dessa beleza.',
    }
  - {
      stanza: 7,
      plain: 'O amor me fez sentir como um grande rei, mas no fim fiquei de mãos vazias.',
      meaning: "Salomão comandava o vento. A expressão 'vento nas mãos' também significa terminar sem nada; o verso junta glória e fracasso.",
    }
glossary: [gazel, amado, vinho, narciso, takhallos]
culturalNotes:
  - title: Salomão e o vento
    body: >-
      No Alcorão, Salomão recebe poder sobre o vento. Hafez usa essa história para um jogo de
      palavras: ter o vento nas mãos pode ser poder imenso ou não ter nada.
    sources: [{ source: alcorao, locator: '21:81' }]
