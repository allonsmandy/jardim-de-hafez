translation:
  language: pt-BR
  kind: translation
  stanzas:
    - - Não esperes obediência, promessa ou bom comportamento de mim, que estou bêbado;
      - desde o dia da criação sou conhecido por beber.
    - - No instante em que me lavei na fonte do amor,
      - fiz quatro despedidas de tudo o que existe.
    - - 'Dá-me vinho, e te contarei o segredo do destino:'
      - por qual rosto me apaixonei e por qual perfume me embriaguei.
    - - Aqui, a cintura da montanha vale menos que a de uma formiga;
      - não percas a esperança na misericórdia, ó amante do vinho.
    - - Tirando aqueles olhos bêbados — que nenhum mal os alcance —,
      - ninguém viveu feliz sob este teto azul.
    - - Minha vida seja dada por tua boca, pois no jardim da beleza
      - o criador do mundo nunca fechou botão mais bonito.
    - - Pelo poder de teu amor, Hafez tornou-se Salomão;
      - isto é, de tua união só lhe restou vento nas mãos.
