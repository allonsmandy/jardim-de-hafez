introduction:
  - Um poema inteiro feito de perguntas. A palavra persa "kojā" (onde?) se repete no fim de todos os
    pares de versos, como um refrão — e mantivemos "onde?" em todos eles na tradução.
  - 'Hafez compara dois mundos: de um lado, a vida certinha, séria, de quem frequenta sermões; do
    outro, a vida dele, de quem prefere a taverna, a música e o amor. Ele não pede desculpas: só
    mostra que a distância entre os dois é enorme.'
  - 'O primeiro verso virou expressão popular no Irã: "de onde até onde!" — usada para dizer que
    duas coisas são completamente diferentes.'
stanzaNotes:
  - stanza: 1
    plain: Eu e uma vida certinha? Não tem nada a ver. Olha a distância entre as duas coisas!
    meaning: 'O poeta mede a distância entre a "retidão" — a conduta correta, prudente, socialmente
      aprovada — e ele mesmo, "arruinado". Não há como aproximar as duas coisas. O tom não é de
      arrependimento: é a constatação, meio irônica, de que ele está em outro caminho.'
    literal:
      Retidão do trabalho onde, e eu arruinado onde? / Vê a diferença do caminho, que é de onde
      até onde.
    choices: '"Kharab" significa arruinado, devastado, mas também, na gíria poética, embriagado
      ("acabado" de tanto beber). Escolhemos "arruinado" porque cobre os dois sentidos em português.
      "Salah-e kar" é "o bem/acerto das coisas": "a retidão das coisas" preserva o tom moral.'
  - stanza: 2
    plain: Cansei dos lugares de reza onde todo mundo finge ser santo. Quero a taverna e o vinho de
      verdade.
    meaning: O "claustro" (sowme'e) é a cela ou o convento dos sufis; o "manto" (kherqe) é a veste
      remendada que os identificava. Hafez diz que se cansou dessa devoção de fachada e quer o
      "templo dos magos" — a taverna — e o vinho puro, símbolo de uma experiência autêntica.
    literal:
      Meu coração se entediou do mosteiro e do manto da fraude; / onde está o templo dos magos e
      onde o vinho puro?
    choices: '"Salus" é o hipócrita que finge devoção; "o manto da hipocrisia" deixa claro o alvo da
      crítica. "Deyr-e moghan" (literalmente "mosteiro dos magos") foi traduzido como "templo dos
      magos" para manter o paralelo irônico com o claustro.'
  - stanza: 3
    plain: Quem vive livre como eu não combina com ser certinho e devoto. Uma coisa é ouvir sermão;
      outra, bem diferente, é ouvir música.
    meaning: 'O rend (ver glossário) não combina com a respeitabilidade e a piedade oficiais. Ouvir
      sermões e ouvir a música do alaúde são coisas de mundos diferentes. Há uma ironia: "sama''"
      (audição) é também o nome da prática sufi de ouvir música em busca do êxtase — Hafez sugere
      que o êxtase está na música, não no sermão.'
    literal:
      Que relação há com a rendice para retidão e piedade? / Audição de sermão onde, melodia de
      rabab onde?
    choices: Mantivemos "rend" em vez de "libertino" ou "boêmio" (ver glossário). O "rabab" é um
      instrumento de cordas tocado com arco ou dedilhado; "alaúde" é o equivalente mais próximo que
      o leitor brasileiro reconhece. "Ouvir o sermão" traduz "sama'-e va'z" preservando o verbo de
      escuta.
  - stanza: 4
    plain:
      Quem não ama não consegue enxergar a beleza do amado. Seria como comparar uma lâmpada apagada
      com o sol.
    meaning: Os que não amam (os "inimigos", os rivais, os censores) não podem perceber a beleza do
      amado, assim como uma lâmpada apagada não se compara ao sol. A luz do amado é tão grande que
      só quem tem o coração "aceso" a vê.
    literal:
      Do rosto do amigo, o coração dos inimigos o que percebe? / Lâmpada morta onde? Vela do sol
      onde?
    choices: '"Dust" (amigo) é uma das palavras persas para o amado, sem gênero, e também um nome de
      Deus na linguagem mística. "Cheragh-e morde" é literalmente "lâmpada morta" — "lâmpada
      apagada" soa natural em português. "Vela do sol" é tradução literal de uma metáfora ousada que
      preferimos não aplainar.'
  - stanza: 5
    plain:
      'Só consigo enxergar direito quando estou na porta da sua casa. Então me diga: para onde eu
      iria, longe daqui?'
    meaning:
      'O colírio (kohl, sorme) era aplicado nos olhos como remédio e cosmético. Dizer que o pó da
      porta do amado é o colírio dos próprios olhos é dizer: só vejo bem quando estou à tua porta.
      Por isso o amante não tem para onde ir.'
    literal: Como o colírio da nossa visão é o pó da soleira de vós, / aonde iremos, ordena, desta
      presença, aonde?
    choices:
      O original usa "shoma" (vós, tratamento respeitoso) e "jenab" (a soleira/presença de alguém
      importante), marcas de reverência; o português "tua soleira" com "dize" mantém a intimidade e
      o pedido. "Colírio dos nossos olhos" é mais compreensível que "colírio da nossa visão",
      mantendo a imagem.
  - stanza: 6
    plain:
      'Coração, cuidado com essa beleza que te atrai: tem uma armadilha no caminho. Por que tanta
      pressa?'
    meaning: O "poço do queixo" é a covinha; a "maçã do queixo", o queixo arredondado. Quem se deixa
      atrair cai no poço — alusão a José (Yusuf), que foi jogado num poço pelos irmãos. O poeta
      adverte o próprio coração, que corre apressado para a perdição da beleza.
    literal:
      Não olhes para a maçã do queixo, pois um poço está no caminho; / aonde vais, ó coração, com
      esta pressa, aonde?
    choices:
      Mantivemos "maçã do queixo" e "poço", em vez de "covinha", porque o jogo de imagens (fruta
      tentadora, poço-armadilha) é o centro do verso; a nota explica a referência física.
  - stanza: 7
    plain:
      O tempo em que estávamos juntos acabou — que boa lembrança! Sinto falta até dos seus olhares
      provocantes e das suas broncas.
    meaning: 'O tempo em que os amantes estavam juntos passou. O poeta sente falta até das coisas
      pequenas: os olhares provocantes e até as reprimendas do amado — tudo era sinal de
      proximidade.'
    literal:
      Foi-se! Que sua lembrança seja boa — o tempo da união; / aquele coquetismo para onde foi, e
      aquela repreensão para onde?
    choices: '"Kereshme" é o gesto faceiro, o olhar de canto de olho com que o amado provoca; "olhar
      faceiro" cobre o sentido. "''Etab" é a repreensão carinhosa ou zangada entre íntimos. "Que
      seja doce a sua lembrança" traduz a fórmula persa "yad-ash khosh bad", usada para lembrar
      algo ou alguém que se foi.'
  - stanza: 8
    plain: Meu amigo, não espere que Hafez tenha calma ou durma. Calma? Paciência? Sono? Isso já não
      existe para mim.
    meaning:
      No dístico com a assinatura, o poeta declara que perdeu o sossego, a paciência e o sono —
      os três sinais clássicos do amante na poesia persa. A série de perguntas sem resposta fecha o
      poema no mesmo tom com que começou.
    literal: Sossego e sono de Hafez não esperes, ó amigo; / sossego o que é, paciência qual, e sono onde?
    choices: '"Qarar" é estabilidade, sossego, firmeza do coração; "repouso" mantém a sonoridade e o
      sentido. Variamos as palavras interrogativas (que, que, onde) como o original (chist, kodam,
      koja).'
