  stanzas:
    - - Ó brisa da manhã, dize com gentileza àquela gazela graciosa
      - que foi ela quem nos lançou às montanhas e aos desertos.
    - - O vendedor de açúcar — que sua vida seja longa! — por que
      - não pergunta pelo papagaio que come açúcar?
    - - Será que o orgulho da tua beleza não te permitiu, ó rosa,
      - perguntar pelo rouxinol enlouquecido?
    - - Com bom trato e gentileza se pode caçar quem sabe ver;
      - com laço e armadilha não se apanha o pássaro sábio.
    - - Não sei por que razão não há cor de amizade
      - nos de porte esbelto, olhos negros e rosto de lua.
