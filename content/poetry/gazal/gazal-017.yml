translation:
  language: pt-BR
  kind: translation
  stanzas:
    - - Meu peito ardeu com a dor de estar longe do amado;
      - o fogo começou no coração e queimou a casa inteira.
    - - Meu corpo se desfez por estar longe do amado;
      - minha alma ardeu no fogo do amor por seu rosto.
    - - Vê quanto sofre meu coração; diante do fogo de minhas lágrimas,
      - até a vela teve pena de mim e ardeu como uma mariposa.
    - - 'Não espanta que um conhecido se compadeça de mim:'
      - quando saí de mim, até o coração do estranho ardeu.
    - - O vinho da taverna levou embora meu manto religioso;
      - o fogo da taberna queimou a morada da razão.
    - - Quando prometi abandonar o vinho, meu coração quebrou como uma taça;
      - longe do vinho e da adega, queimei por dentro como a tulipa.
    - - 'Deixa a disputa e volta: a pupila de meus olhos'
      - tirou o manto pela cabeça e o queimou em agradecimento.
    - - 'Abandona as histórias, Hafez, e bebe vinho por um instante:'
      - não dormimos esta noite, e a vela se consumiu com a história.
