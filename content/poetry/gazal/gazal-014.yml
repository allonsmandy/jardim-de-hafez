  stanzas:
    - - 'Eu disse: ó sultão dos belos, tem piedade deste estrangeiro.'
      - 'Disse: correndo atrás do coração, perde-se o pobre estrangeiro.'
    - - 'Pedi: fica um instante. Disse: perdoa-me;'
      - quem foi criado em casa não aguenta tanta tristeza de estrangeiro.
    - - Que importa ao delicado que dorme sobre peles reais
      - se o estrangeiro faz de espinhos e pedras a sua cama e o seu travesseiro?
    - - Ó tu, em cujos cachos acorrentados há lugar para tantos conhecidos,
      - que estranha fica a pinta de almíscar sobre esse rosto colorido!
    - - O reflexo do vinho aparece no teu rosto de lua
      - como pétala de olaia sobre a rosa-branca — que estranho!
    - - Que estranha caiu aquela fila de formigas da penugem em volta do teu rosto —
      - embora, numa galeria de pinturas, uma linha de almíscar não seja estranha.
    - - 'Eu disse: teus cachos cor de noite são a noite dos estrangeiros;'
      - cuidado com a madrugada, quando este estrangeiro chorar.
    - - 'Disse: Hafez, até os íntimos vivem perplexos;'
      - não admira que se sente cansado e desvalido o estrangeiro.
