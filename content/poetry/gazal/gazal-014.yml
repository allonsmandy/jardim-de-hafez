themes:
  - Um diálogo com o amado
  - Sentir-se estrangeiro
  - A beleza que é estranha e maravilhosa
introduction:
  - 'Um diálogo: o poeta pede, o amado responde. Todos os pares de versos terminam com a mesma
    palavra persa, "gharib", que quer dizer "estrangeiro" (alguém longe de casa, sozinho) e também
    "estranho" (curioso, maravilhoso). Hafez joga com os dois sentidos o poema inteiro.'
  - Para manter esse refrão, terminamos cada verso par com "estrangeiro" ou "estranho", conforme o
    sentido.
stanzaNotes:
  - stanza: 1
    plain:
      'Pedi: "Você, a pessoa mais linda de todas, tenha pena de mim, que estou sozinho." Respondeu:
      "Quem segue o coração acaba se perdendo."'
    meaning:
      'O amante se apresenta como estrangeiro, sem casa nem apoio. A resposta do amado é fria,
      mas também sábia: quem se deixa guiar só pela paixão se perde.'
    choices: Para manter o refrão, terminamos os dois versos com "estrangeiro".
  - stanza: 2
    plain:
      'Pedi: "Fique um pouco." Respondeu: "Desculpe, eu sempre vivi no conforto — não aguento tanta
      tristeza."'
    meaning:
      O amado, mimado ("criado em casa"), não suporta a dor do amante sem lar. É um retrato da
      distância entre quem ama e quem é amado.
    choices:
      '"Khāne-parvard" (criado em casa) é quem cresceu protegido, mimado; mantivemos a expressão
      literal.'
  - stanza: 3
    plain: Quem dorme em lençóis de luxo não se importa com quem dorme no chão, sobre espinhos e pedras.
    meaning:
      '"Sanjāb" é a pele de esquilo cinza, forro de luxo dos reis. O contraste social é forte: o
      amado vive no conforto; o amante, na intempérie.'
    choices: '"Peles reais" simplifica "pele de esquilo real", que soaria estranho em português.'
  - stanza: 4
    plain: Muita gente está presa nos seus cabelos. Mas a pinta escura no seu rosto rosado é que é
      surpreendente!
    meaning:
      'Os "conhecidos" (āshnā) presos nos cachos se opõem ao "estranho" (gharib): a pinta é uma
      estrangeira solitária no rosto, e também uma maravilha. O jogo com o refrão fica claro aqui.'
    choices: Aqui "gharib" tem o sentido de "estranho, admirável"; por isso usamos "estranha".
  - stanza: 5
    plain: O vinho deixa seu rosto claro levemente avermelhado, como uma pétala roxa sobre uma flor
      branca. Que lindo e que curioso!
    meaning: A olaia (arghavān, a "árvore-de-judas") tem flores vermelho-arroxeadas; a rosa-branca
      (nasrin), pétalas muito claras. O rosto claro com o rubor do vinho seria essa combinação.
    choices:
      '"Olaia" é o nome português da árvore (Cercis siliquastrum); "rosa-branca" traduz "nasrin",
      uma roseira de flores brancas.'
  - stanza: 6
    plain:
      A penugem escura que nasce em volta do seu rosto parece uma fila de formigas — curioso! Mas,
      num rosto que é uma obra de arte, um traço escuro até combina.
    meaning:
      '"Khatt" é a penugem de um rosto jovem e também "linha", "escrita". A penugem é comparada a
      uma fila de formigas e a um traço de tinta (almíscar, escuro) numa pintura. O rosto é uma
      "galeria de pinturas" (negārestān).'
    choices: 'Um dos versos mais difíceis de traduzir: o jogo entre penugem, traço de pintura e
      caligrafia só funciona com nota.'
  - stanza: 7
    plain: 'Falei: "Seus cabelos escuros são como uma noite triste para quem está longe de casa.
      Cuidado: de madrugada, quando eu chorar, minhas preces podem ter efeito."'
    meaning:
      '"A noite dos estrangeiros" (shām-e gharibān) é a noite triste de quem está longe de casa.
      As preces e lamentos feitos de madrugada eram considerados especialmente poderosos — por isso
      o aviso.'
    choices: Mantivemos "noite dos estrangeiros" como expressão, explicada aqui.
  - stanza: 8
    plain:
      'Respondeu: "Hafez, até quem está perto de mim vive confuso. Não é de estranhar que você, que
      está longe, se sinta cansado e perdido."'
    meaning:
      '"Maqām-e heyrat", a estação da perplexidade, é uma etapa do caminho sufi: o deslumbramento
      diante do mistério de Deus. Na leitura espiritual, nem os mais próximos de Deus O compreendem
      — que dirá o "estrangeiro".'
    choices: Terminamos com "estrangeiro" para fechar o refrão.
