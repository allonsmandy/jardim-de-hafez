  stanzas:
    - - Cabelos revoltos, rosto suado, lábios sorridentes e embriagado,
      - camisa aberta, cantando um gazel e com a jarra na mão;
    - - olhos provocadores e lábios que zombavam,
      - veio ontem à meia-noite, sentou-se junto à minha cama;
    - - inclinou a cabeça até meu ouvido e, com voz triste,
      - "perguntou: 'Meu antigo amante, estás dormindo?'"
    - - Se um amante recebe de madrugada um vinho como esse
      - e não passa a amar o vinho, então é infiel ao amor.
    - - Vai embora, devoto, e não critiques quem bebe o resto do vinho;
      - no primeiro dia da criação, não recebemos outro presente.
    - - Bebemos tudo o que ele derramou em nossa taça,
      - fosse o vinho do paraíso ou o vinho que embriaga.
    - - O sorriso da taça e os cabelos do amado, cheios de nós,
      - quebraram muitas promessas, inclusive a de Hafez.
