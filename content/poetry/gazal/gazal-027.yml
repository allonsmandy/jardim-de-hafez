themes: [A chegada do amado, Perder-se de si, Pedir que alguém volte]
introduction:
  - >-
    O amado entra na taverna e todos ficam embriagados antes mesmo de beber: basta olhar para seus
    olhos. A beleza altera tudo ao redor, do perfume às árvores.
  - Hafez termina pedindo que ele volte. Sabe que o tempo perdido não retorna, mas ainda espera que a
    presença do amado devolva vida ao que restou.
stanzaNotes:
  - {
      stanza: 1,
      plain: 'O amado chegou com vinho, e seu olhar deixou todos tão tontos quanto a bebida.',
      meaning: 'A taverna é concreta e também lugar de liberdade espiritual fora da religião de aparência.',
    }
  - {
      stanza: 2,
      plain: 'Até a lua e uma árvore alta parecem menores diante da beleza do amado.',
      meaning: 'A ferradura curva lembra a lua nova; o pinheiro alto perde a comparação com o corpo elegante.',
    }
  - {
      stanza: 3,
      plain: 'Perdi a noção de mim mesmo, mas continuo vendo o amado em toda parte.',
      meaning: 'O amor apaga a consciência do próprio eu e, ao mesmo tempo, concentra toda a atenção numa pessoa.',
    }
  - {
      stanza: 4,
      plain: 'Quando ele saiu, meu coração perdeu a luz; quando se sentou, todos gritaram de admiração.',
      meaning: 'Levantar e sentar criam movimentos opostos: a partida apaga o poeta, a presença anima os outros.',
    }
  - {
      stanza: 5,
      plain: 'O perfume e a tinta só ganharam beleza por tocar seus cabelos e sobrancelhas.',
      meaning: 'A tinta cosmética desenha sobrancelhas; Hafez diz que os enfeites recebem beleza do amado, não o contrário.',
    }
  - {
      stanza: 6,
      plain: 'Volta e talvez eu recupere a vida, embora saiba que o tempo perdido não volta.',
      meaning: 'A flecha lançada não retorna ao arco. O verso mantém juntas esperança e consciência da perda.',
    }
glossary: [gazel, amado, vinho, pir-e-moghan, takhallos]
culturalNotes:
  - {
      title: 'A flecha que não volta',
