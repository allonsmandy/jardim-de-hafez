translation:
  language: pt-BR
  kind: translation
  stanzas:
    - - Meu amado entrou no templo dos magos com uma taça na mão,
      - embriagado de vinho, e os bebedores embriagados por seus olhos.
    - - Na ferradura de seu cavalo apareceu a lua nova;
      - diante de seu corpo alto, o pinheiro pareceu pequeno.
    - - Como posso dizer que ainda sei de mim, se já não sei?
      - E como dizer que não o vejo, se meus olhos só veem a ele?
    - - A vela de meu coração apagou quando ele se levantou;
      - e o clamor dos admiradores se levantou quando ele se sentou.
    - - Se o perfume ficou agradável, foi por se prender em seus cabelos;
      - se a tinta virou arco, foi por se unir a suas sobrancelhas.
    - - Volta, para que a vida perdida de Hafez volte também,
      - embora a flecha lançada pelo arco jamais retorne.
