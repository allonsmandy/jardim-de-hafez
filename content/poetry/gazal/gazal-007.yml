      - Adão deixou o jardim do paraíso, a morada da paz.
    - - Temos muitos anos de serviço à tua porta;
      - ó senhor, olha de novo, com compaixão, para o teu servo.
    - - Hafez é discípulo da taça de vinho. Ó brisa, vai
