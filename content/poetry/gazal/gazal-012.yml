translation:
  language: pt-BR
  kind: translation
  stanzas:
    - - Ó tu, de cujo rosto brilhante vem o fulgor da lua da beleza,
      - do poço do teu queixo vem a honra da formosura.
    - - 'Minha alma, que já me chegou aos lábios, quer ver-te:'
      - deve voltar ou sair? Qual é a tua ordem?
    - - No tempo dos teus olhos de narciso ninguém ficou a salvo;
      - melhor não vender a castidade aos teus embriagados.
    - - Nossa sorte sonolenta talvez desperte enfim,
      - porque teu rosto brilhante jogou água nos olhos dela.
    - - 'Manda com a brisa um buquê das rosas do teu rosto:'
      - talvez sintamos um perfume da terra do teu jardim.
    - - Que tenhais vida e êxito, ó copeiros do banquete de Jamshid,
      - ainda que nossa taça não se tenha enchido de vinho no vosso tempo.
    - - 'O coração anda fazendo estragos: avisem quem o roubou.'
      - Cuidado, amigos — pela minha vida e pela vossa!
    - - Quando, ó Deus, se cumprirá o desejo de que se aliem
      - o meu espírito em ordem e os teus cabelos em desordem?
    - - Afasta a barra das tuas vestes do pó e do sangue quando passares por nós,
      - pois neste caminho há muitos mortos — sacrificados por ti.
    - - 'Hafez faz uma prece: escuta-a e diz amém —'
      - que o nosso sustento seja teu lábio de rubi que derrama açúcar.
    - - 'Ó brisa, dize aos moradores da cidade de Yazd, da nossa parte:'
      - “Que a cabeça dos ingratos seja bola para o vosso taco de polo!”
    - - 'Ainda que estejamos longe do tapete da proximidade, a intenção não está longe:'
      - somos servos do vosso rei e cantamos os vossos louvores.
    - - 'Ó rei dos reis de estrela elevada, por Deus, um favor:'
      - que eu beije, como as estrelas, o pó do teu palácio.
