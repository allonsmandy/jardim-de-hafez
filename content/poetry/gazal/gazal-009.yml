translation:
  language: pt-BR
  kind: translation
  stanzas:
    - - 'O jardim tem de novo o brilho da juventude:'
      - chega ao rouxinol de canto doce a boa-nova da rosa.
    - - Ó brisa, se voltares a encontrar os jovens do prado,
      - leva nossos cumprimentos ao cipreste, à rosa e ao manjericão.
    - - Se o jovem dos magos, vendedor de vinho, se mostrar assim tão belo,
      - farei de meus cílios a vassoura da porta da taverna.
    - - Ó tu que traças sobre a lua um taco de polo de âmbar puro,
      - não deixes ainda mais aflito a mim, que já ando rodando sem rumo.
    - - Temo que essa gente que ri dos que bebem a borra do vinho
      - acabe perdendo a própria fé pela causa da taverna.
    - - Sê amigo dos homens de Deus, pois na arca de Noé
      - há um pó que não dá um gole d’água pelo dilúvio.
    - - Sai da casa do céu e não lhe peças pão,
      - pois esse avarento de tigela negra acaba matando o hóspede.
    - - Para quem terá como último leito um punhado de terra,
      - 'dize: que necessidade há de erguer palácios até o céu?'
    - - 'Minha lua de Canaã! O trono do Egito agora é teu:'
      - é hora de dizeres adeus à prisão.
    - - Hafez, bebe vinho, sê rend e sê feliz, mas
      - não faças do Alcorão, como os outros, uma armadilha de fraude.
