translation:
  language: pt-BR
  kind: translation
  stanzas:
    - - Ontem à noite nosso mestre foi da mesquita para a taverna;
      - companheiros de caminho, qual será agora o nosso plano?
    - - Nós, discípulos, como vamos voltar o rosto para a direção da oração,
      - se o nosso mestre voltou o rosto para a casa do vendedor de vinho?
    - - Na taverna do caminho seremos companheiros de morada,
      - pois assim foi escrito o nosso destino desde antes do início dos tempos.
    - - Se a razão soubesse como é bom o coração preso nos cachos dele(a),
      - os sensatos enlouqueceriam para vir atrás das nossas correntes.
    - - Teu belo rosto nos revelou um versículo de graça;
      - desde então, só há graça e beleza na nossa interpretação.
    - - Com teu coração de pedra, será que alguma noite fará efeito
      - o suspiro de fogo e o ardor do peito que vela a noite toda?
    - - A flecha do nosso suspiro atravessa o céu. Hafez, cala-te!
      - Tem piedade da tua alma — cuidado com a nossa flecha.
