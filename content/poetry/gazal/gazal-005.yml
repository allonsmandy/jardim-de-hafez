translation:
  language: pt-BR
  kind: translation
  stanzas:
    - - O coração me escapa das mãos — ó vós que tendes coração, por Deus!
      - Ai de mim, o segredo oculto vai se tornar manifesto.
    - - 'Somos náufragos: ó vento favorável, levanta-te!'
      - Talvez eu volte a ver o rosto do amigo.
    - - 'O afeto de dez dias da roda do céu é fábula e feitiço:'
      - fazer o bem aos amigos — aproveita a ocasião, amigo.
    - - 'No círculo da rosa e do vinho, o rouxinol cantou belamente ontem à noite:'
      - “Trazei o vinho da aurora! Despertai, ó embriagados!”
    - - Ó tu, cheio de nobreza, em gratidão pela tua boa sorte,
      - pergunta um dia pelo dervixe desvalido.
    - - 'A paz dos dois mundos se explica nestas duas palavras:'
      - com os amigos, generosidade; com os inimigos, tolerância.
    - - Pelo bairro da boa reputação não nos deixaram passar;
      - se não te agrada, muda tu o destino.
    - - Aquela amarga a que o sufi chamou "mãe de todos os vícios"
      - nos é mais desejável e mais doce que o beijo das virgens.
    - - Em tempo de penúria, busca o deleite e a embriaguez,
      - pois esta alquimia da existência faz do mendigo um Qarun.
    - - Não sejas rebelde, ou, como a vela, te queimará de ciúme
      - o amado em cuja mão o granito é cera.
    - - 'O espelho de Alexandre é a taça de vinho: olha,'
      - e ela te mostrará o estado do reino de Dario.
    - - 'Os belos que falam persa são doadores de vida:'
      - copeiro, dá a boa-nova aos rends devotos.
    - - 'Hafez não vestiu por vontade própria este manto manchado de vinho:'
      - ó xeque de vida imaculada, perdoa-nos.
