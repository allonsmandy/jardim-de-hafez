translation:
  language: pt-BR
  kind: translation
  stanzas:
    - - A lembrança de teu rosto me acompanha por todos os caminhos;
      - a brisa de teus cabelos mantém unida minha alma desperta.
    - - Apesar dos que nos proíbem de amar,
      - a beleza de teu rosto é razão suficiente para nós.
    - - 'Escuta o que diz a covinha de teu queixo:'
      - mil Josés do Egito caíram em nosso poço.
    - - Se minha mão não alcança teus longos cabelos,
      - a culpa é de minha sorte confusa e de meu braço curto.
    - - Diz ao guarda da porta de teus aposentos
      - que este desconhecido vive humilde junto à tua entrada.
    - - Embora teu rosto esteja escondido de meus olhos,
      - ele está sempre presente em minha lembrança tranquila.
    - - 'Se Hafez bater à porta uma vez por ano, abre:'
      - há anos ele deseja ver teu rosto de lua.
