themes: [Levar o amado na lembrança, Amar apesar das críticas, Esperar junto à porta]
introduction:
  - O amado está longe e talvez seja impossível alcançá-lo. Mesmo assim, sua lembrança acompanha
    Hafez por toda parte e torna a ausência um tipo de presença.
  - >-
    O poeta pede apenas que a porta seja aberta de vez em quando. O tom mistura humildade, desejo e
    humor: ele culpa a má sorte e até o próprio braço curto por não alcançar os cabelos do amado.
stanzaNotes:
  - {
      stanza: 1,
      plain: 'Mesmo longe, lembro de ti em todo lugar; essa lembrança me mantém vivo.',
      meaning: 'O perfume dos cabelos chega como uma brisa. Para Hafez, recordar o amado alimenta a alma.',
    }
  - {
      stanza: 2,
      plain: 'Os outros podem proibir nosso amor; tua beleza já é motivo suficiente para continuar.',
      meaning: 'Hafez não responde aos críticos com uma regra. Responde dizendo que basta olhar o amado para entender por que ama.',
    }
  - {
      stanza: 3,
      plain: 'Tua covinha é como um poço capaz de prender até os homens mais belos.',
      meaning: "José, conhecido por sua beleza, foi lançado num poço. A covinha do queixo vira outro poço onde muitos 'Josés' caem de amor.",
    }
  - {
      stanza: 4,
      plain: 'Se não consigo te alcançar, a culpa é da minha má sorte e de minhas limitações.',
      meaning: "Os cabelos são algo desejado, mas distante. 'Mão curta' também significa ter pouco poder para conseguir o que se quer.",
    }
  - {
      stanza: 5,
      plain: 'Pede ao guarda que me deixe esperar humildemente junto à tua porta.',
      meaning: 'O amado vive como alguém importante, protegido por um porteiro. Hafez aceita o lugar mais baixo apenas para permanecer perto.',
    }
  - {
      stanza: 6,
      plain: 'Não consigo te ver com os olhos, mas te vejo o tempo todo em minha mente.',
      meaning: 'A distância física não apaga o amado. A memória cria uma presença interior que ninguém pode impedir.',
    }
  - {
      stanza: 7,
      plain: 'Se eu aparecer raramente, ainda assim abre a porta; espero por esse encontro há anos.',
      meaning: 'Hafez usa sua assinatura para pedir acolhimento. O rosto comparado à lua é belo, luminoso e distante.',
    }
glossary: [gazel, amado, jose-zuleica, takhallos]
culturalNotes:
  - title: José no poço
    body: José aparece no Alcorão como homem de beleza extraordinária lançado num poço. Hafez transforma a covinha do amado em um poço ainda mais irresistível.
    sources: [{ source: alcorao, locator: '12:10–19' }]
