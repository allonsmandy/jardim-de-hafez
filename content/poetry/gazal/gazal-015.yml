translation:
  language: pt-BR
  kind: translation
  stanzas:
    - - Ó beleza sagrada, quem desata o laço do teu véu?
      - Ó pássaro do paraíso, quem te dá o grão e a água?
    - - 'Fugiu o sono dos meus olhos com este pensamento que me queima por dentro:'
      - de quem é o abraço que virou a morada do teu descanso e do teu sono?
    - - Não perguntas pelo dervixe, e temo que não tenhas
      - nem pensamento de perdão, nem cuidado com a recompensa divina.
    - - Aquele olhar lânguido assaltou o caminho do coração dos amantes;
      - por esse jeito se vê que o teu vinho é forte.
    - - A flecha que me lançaste ao coração com um olhar errou o alvo;
      - vejamos agora o que pensa o teu juízo certeiro.
    - - A cada gemido e grito que dei, não me ouviste;
      - é evidente, ó bela, que a tua posição é alta demais.
    - - 'A fonte d’água está longe deste deserto: cuidado,'
      - que o demônio do deserto não te engane com uma miragem.
    - - Vejamos como seguirás no caminho da velhice, ó coração;
      - afinal, por engano, gastaste os dias da tua juventude.
    - - Ó palácio que alegras o coração, morada da intimidade,
      - meu Deus, que as desgraças dos dias não te arruínem.
    - - Hafez não é um escravo que fuja do seu senhor;
      - faz as pazes e volta, que estou arruinado pela tua repreensão.
