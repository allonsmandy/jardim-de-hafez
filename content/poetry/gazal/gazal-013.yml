  stanzas:
    - - 'A manhã desponta e as nuvens armaram um dossel:'
      - o vinho da aurora, o vinho da aurora, ó companheiros!
    - - 'O orvalho goteja no rosto da tulipa:'
      - o vinho, o vinho, ó amigos queridos!
    - - 'Do prado sopra a brisa do paraíso:'
      - eia, bebei a cada instante o vinho puro!
    - - 'A rosa armou no prado um trono de esmeralda:'
      - toma o vinho que é como um rubi de fogo.
    - - 'Fecharam de novo a porta da taverna:'
      - abre, ó Tu que abres as portas!
    - - Teus lábios e teus dentes têm o direito do sal
      - sobre as almas e os peitos assados de dor.
    - - Numa estação como esta, é estranho
      - que fechem as tavernas com tanta pressa.
    - - Diante do rosto do copeiro de corpo de fada,
      - bebe, como Hafez, o vinho puro.
