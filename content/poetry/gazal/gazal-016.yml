translation:
  language: pt-BR
  kind: translation
  stanzas:
    - - Tua sobrancelha travessa curvou-se como um arco
      - e apontou para a vida deste pobre amante indefeso.
    - - 'Antes mesmo de existirem este mundo e o outro, nosso amor já existia:'
      - não foi agora que o tempo começou essa história.
    - - Com um só gesto de sedução, o narciso se exibiu;
      - teus olhos, muito mais sedutores, espalharam cem tumultos pelo mundo.
    - - Depois de beber, caminhas pelo jardim com o rosto suado;
      - diante do seu brilho, as flores vermelhas parecem pegar fogo.
    - - Ontem à noite, passei embriagado pela festa do jardim;
      - o botão de rosa me fez pensar em tua boca.
    - - A violeta ajeitava sua mecha enrolada;
      - então a brisa da manhã começou a falar de teus cabelos.
    - - Envergonhado por eu o ter comparado ao teu rosto,
      - o jasmim, pela mão da brisa, cobriu a boca de terra.
    - - Antes, por querer ser devoto, eu evitava o vinho e a música;
      - depois, o desejo pelos jovens da taverna me arrastou para outra vida.
    - - 'Agora lavo meu manto religioso com vinho vermelho:'
      - ninguém consegue fugir do destino que recebeu antes de nascer.
    - - Talvez Hafez só pudesse se libertar perdendo a boa fama,
      - pois uma graça antiga o conduziu ao vinho dos magos.
    - - Agora o mundo seguirá meu desejo, pois a roda do tempo
      - me lançou ao serviço do senhor do mundo.
