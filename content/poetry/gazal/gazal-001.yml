culturalNotes:
  - title: Por que este poema abre o Divã
    body: Nos manuscritos e na edição Qazvini-Ghani, os gazéis estão em ordem alfabética pela letra
      final da rima. Este gazel rima em "alef" (a primeira letra), por isso vem primeiro — não por
      escolha temática de Hafez, que não organizou o Divã em vida.
    sources:
      - source: qazvini-ghani
  - title: Árabe e persa no mesmo poema
    body: Misturar versos árabes ao persa (molamma') era um recurso de virtuosismo. Para um leitor
      iraniano, o árabe soa como a língua do sagrado e da erudição; Hafez o usa para emoldurar um
      poema sobre vinho e amor, numa mistura de solenidade e ousadia.
