translation:
  language: pt-BR
  kind: translation
  stanzas:
    - - Ó copeiro, faz girar a taça e oferece-a,
      - pois o amor pareceu fácil no começo, mas vieram as dificuldades.
    - - Na esperança do perfume de almíscar que a brisa enfim soltará daquela mecha,
      - com a torção daqueles cachos negros como almíscar, quanto sangue caiu nos corações!
    - - Que segurança tenho eu para gozar a morada do amado, se a cada instante
      - 'o sino da caravana clama: "Amarrai as liteiras!"?'
    - - Tinge de vinho o tapete de oração, se o velho dos magos te disser,
      - pois o viajante do caminho não ignora a estrada e os costumes de cada pouso.
    - - Noite escura, medo das ondas e um redemoinho tão terrível —
      - como saberiam do nosso estado os de carga leve, nas praias?
    - - Toda a minha vida, por seguir minha vontade, acabou na má fama;
      - como ficaria oculto um segredo de que se fazem rodas de conversa?
    - - 'Se desejas a presença, Hafez, não te ausentes dele:'
      - quando encontrares quem amas, deixa o mundo e abandona-o.
