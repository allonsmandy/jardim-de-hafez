translation:
  language: pt-BR
  kind: translation
  stanzas:
    - - A rosa vermelha floresceu e o rouxinol ficou embriagado;
      - é um chamado à alegria, ó sufis que amais o vinho.
    - - A decisão de não beber parecia firme como pedra;
      - vê como a taça de vidro a quebrou facilmente.
    - - Traz o vinho, pois diante de quem nada deseja
      - guarda e sultão, sóbrio e bêbado, valem o mesmo.
    - - Já que precisamos partir desta hospedaria de duas portas,
      - pouco importa se o teto de nossa vida é alto ou baixo.
    - - Não se alcança um lugar de alegria sem sofrimento;
      - sim, o acordo do princípio foi firmado sob a lei da provação.
    - - Não atormentes a mente com ter ou não ter; vive contente,
      - pois tudo o que chega à perfeição acaba desaparecendo.
    - - A grandeza do ministro, o cavalo de vento e a língua dos pássaros
      - foram levados pelo vento, e seu senhor nada ganhou.
    - - 'Não saias do caminho confiando em asas e penas:'
      - a flecha voa por um tempo, mas termina no chão.
    - - Como tua pena poderá agradecer, Hafez,
      - se tuas palavras passam de mão em mão?
