id: gazal-191
category: gazal
number: 191
firstLine:
  fa: |-
    آن، کیست کز روی
    کَرَم، با ما وفاداری کند؟
originalLanguage: fa
original:
  language: fa
  stanzas:
    - - |-
        آن، کیست کز روی
        کَرَم، با ما وفاداری کند؟
      - |-
        بر جای بدکاری چو من،
        یک دم نکوکاری کند؟
    - - |-
        اول، بِه بانگِ نای و
        نی، آرد به دل، پیغام وی
      - |-
        وآن‌گه به یک پیمانه
        می، با من وفاداری کند
    - - |-
        دلبر که جان فرسود از
        او، کام دلم نگْشود از او
      - |-
        نومید نتْوان بود از
        او، باشد که دلداری کند
    - - |-
        گفتم: «گره نگْشوده‌ام،
        زان طُرّه تا من بوده‌ام»
      - |-
        گفتا: «مَنَش فرموده‌ام،
        تا با تو طَرّاری کند»
    - - |-
        پشمینه‌پوش تندخو، از
        عشق نشنیده‌ست بو
      - |-
        با مستی‌اش، رمزی بگو!
        تا تَرکِ هشیاری کند
    - - |-
        چون من گدای بی‌نشان،
        مشکل بود یاری چُنان
      - |-
        سلطان کجا عیشِ نهان،
        با رندِ بازاری کند؟
    - - |-
        زآن طُرّهٔ پرپیچ و خم،
        سهل است اگر بینم ستم
      - |-
        از بند و زنجیرش چه غم،
        هر کس که عیّاری کند؟
    - - |-
        شد لشکر غم بی‌عدد، از
        بخت می‌خواهم مدد
      - |-
        تا فخرِ دین عبدالصّمد،
        باشد که غم‌خواری کند
    - - |-
        با چشم پر نیرنگ او،
        «حافظ»! مکن آهنگ او!
      - |-
        کآن طُرِّهٔ شبرنگِ
        او، بسیار طرّاری کند
