id: ahu-ye-vahshi-001
category: ahu-ye-vahshi
number: 1
firstLine:
  fa: اَلا اِی آهویِ وحشی! کجایی؟
originalLanguage: fa
original:
  language: fa
  stanzas:
    - - اَلا اِی آهویِ وحشی! کجایی؟
      - مرا با توست چندین آشنایی
    - - دو تنها و دو سرگردان، دو بی‌کس
      - دَد و دامت، کمین از پیش و از پس
    - - بیا تا حال یکدیگر بِدانیم
      - مُرادِ هم بجوییم ار توانیم
    - - که می‌بینم که این دشتِ مشوَّش
      - چراگاهی ندارد خرّم و خَوش
    - - که خواهد شد؟ بگویید ای رفیقان!
      - رفیقِ بی‌کسان! یارِ غریبان!
    - - مگر خضرِ مبارک پی درآید
      - ز یمنِ همتش، کاری گشاید
    - - مگر وقتِ وفا پروردن آمد
      - که فالم «لا تَذَرْنِی فَرْداً» آمد
    - - چنینم هست یاد از پیرِ دانا
      - فراموشم نشد، هرگز همانا
    - - که روزی ره‌رَوی در سرزمینی
      - به لطفش گفت رِندی ره‌نشینی
    - - که «ای سالک! چه در اَنبانه داری؟
      - بیا دامی بِنِه، گر دانه داری»
    - - جوابش داد، گفتا «دام دارم
      - ولی سیمرغ می‌باید شکارم»
    - - بگفتا «چون به دست آری نشانش
      - که از ما بی‌نشان است آشیانش»
    - - چو آن سروِ روان شد کاروانی
      - چو شاخِ سرو می‌کن دیده‌بانی
    - - مَدِه جامِ مِی و پایِ گُلَ ازْ دست
      - ولی غافل مباش از دهرِ سرمست
    - - لبِ سرچشمه‌ای و طرْفِ جویی
      - نمِ اشکی و با خود گفت و گویی
    - - نیازِ من چه وزن آرد بدین ساز؟
      - که خورشیدِ غنی شد کیسه‌پرداز
    - - به یادِ رفتگان و دوست‌داران
      - موافق گَرد با ابرِ بهاران
    - - چنان بی‌رحم زد تیغِ جدایی
      - که گویی خود نبوده است آشنایی
    - - چو نالان آمدت آبِ روان پیش
      - مدد بخشش از آبِ دیدهٔ خویش
    - - نکرد آن هم‌دمِ دیرین مدارا
      - مسلمانان! مسلمانان! خدا را
    - - مگر خضرِ مبارک‌پِی تواند
      - که این تنها بدان تنها رساند
    - - تو گوهر بین و از خَرمُهره بگذر
      - ز طرزی، کآن نگردد شهره، بگذر
    - - چو من ماهیِ کِلک آرَم به تحریر
      - تو از «نون والقلم» می‌پرس تفسیر
    - - روان را با خرَد دَرهم سِرِشتم
      - وَز آن تخمی، که حاصل بود، کِشتم
    - - فرح‌بخشی درین ترکیب پیداست
      - که نغزِ شعر و مغزِ جانِ اجزاست
    - - بیا وَز نکهتِ این طیبِ امّید
      - مشامِ جان، معطّر ساز جاوید
    - - که این نافه زِ چینِ جیبِ حور است
      - نه آن آهو که از مَردم نُفور است
    - - رفیقان! قدرِ یکدیگر بدانید
      - چو معلوم است شرح از بَر مخوانید
    - - مقالاتِ نصیحت‌گو همین است
      - که سنگ‌اندازِ هجران در کمین است
