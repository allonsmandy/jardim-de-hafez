# Registro de fontes. Toda referência em poemas e notas precisa apontar para um id daqui.
# `usableForPublication` só deve ser `true` depois de verificar a situação de direitos.
# Ver docs/copyright-and-sources.md.

- id: qazvini-ghani
  type: critical-edition
  title: Divan-e Khajeh Shamseddin Mohammad Hafez-e Shirazi
  authors: [Mohammad Qazvini, Qasem Ghani]
  year: '1941 (1320 do calendário solar iraniano)'
  publisher: Teerã
  rights:
    status: public-domain
    note: >-
      O texto de Hafez (século XIV) é de domínio público. A edição Qazvini-Ghani é a base
      da numeração tradicional de 495 gazéis; usamos sua numeração e seu estabelecimento do texto
      como referência, sem reproduzir aparato crítico, prefácios ou notas dos editores.
  usableForPublication: true

- id: ganjoor
  type: digital-transcription
  title: Ganjoor — Divã de Hafez (transcrição digital da edição Qazvini-Ghani)
  url: https://ganjoor.net/hafez
  rights:
    status: open-license
    note: >-
      O Ganjoor é um projeto iraniano sem fins comerciais que digitaliza a poesia persa e libera seu
      acervo para que outros façam trabalhos parecidos (como diz a página "Sobre" do site). O poema
      em si é de domínio público. Copiamos daqui só o texto dos versos, sempre com crédito e link —
      os comentários e resumos do Ganjoor não são usados.
    verifiedAt: 2026-11-07
  usableForPublication: true

- id: hafizonlove
  type: website
  title: Hafiz on Love
  authors: [Shahriar Shahriari]
  year: '1999–2025'
  url: https://www.hafizonlove.com
  rights:
    status: restricted
    note: >-
      Site de Shahriar Shahriari que apresenta Hafez em inglês há décadas e inspirou este projeto. O
      autor permite uso não comercial com crédito, mas isso não inclui traduzir ou adaptar suas
      traduções. Por isso só o consultamos para conferir a numeração e a organização dos poemas.
  usableForPublication: false

